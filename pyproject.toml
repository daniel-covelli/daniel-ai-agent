[project]
name = "daniel-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Covelli", email = "57047397+daniel-covelli@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "stripe>=16.0.0",
    "temporalio>=1.18.2",
    "uvicorn>=0.39.0",
]

[project.scripts]
daniel-ai-agent = "daniel_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling what to include
[tool.hatch.build.targets.wheel]
packages = ["activities", "api", "models", "prompts", "shared", "tools", "workflows"]